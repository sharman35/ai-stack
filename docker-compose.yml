name: ai-stack
services:
  singbox:
    image: ghcr.io/sagernet/sing-box:${SINGBOX_VERSION:-1.14.4}
    command: [run, -c, /etc/sing-box/config.json]
    restart: unless-stopped
    volumes:
      - ./data/singbox/config.json:/etc/sing-box/config.json:ro
      - ./data/singbox/cache:/var/lib/sing-box
    networks: [private, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  cliproxy:
    image: eceasy/cli-proxy-api:${CLIPROXY_VERSION:-v8.0.77}
    restart: unless-stopped
    depends_on: [singbox]
    volumes:
      - ./data/cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/cliproxy/auths:/root/.cli-proxy-api
      - ./data/cliproxy/logs:/CLIProxyAPI/logs
    ports:
      - "${NETBIRD_IP:?Run install.sh first}:8317:8317"
    networks: [private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION:-latest}
    command: [gateway, run]
    restart: unless-stopped
    depends_on: [cliproxy, singbox]
    volumes:
      - ./data/hermes:/opt/data
    ports:
      - "${NETBIRD_IP:?Run install.sh first}:9119:9119"
      - "${NETBIRD_IP:?Run install.sh first}:8642:8642"
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?Missing dashboard password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SECRET:?Missing session secret}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?Missing API key}
      CLIPROXY_KEY: ${CLIPROXY_KEY:?Missing proxy key}
      HTTP_PROXY: http://singbox:2080
      HTTPS_PROXY: http://singbox:2080
      http_proxy: http://singbox:2080
      https_proxy: http://singbox:2080
      NO_PROXY: localhost,127.0.0.1,cliproxy,singbox
      no_proxy: localhost,127.0.0.1,cliproxy,singbox
    networks: [private]

networks:
  private:
    internal: true
  egress: {}
